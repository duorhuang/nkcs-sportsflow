<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <defs>
    <linearGradient id="pewterSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#CBD5E1" />
      <stop offset="60%" stop-color="#64748B" />
      <stop offset="85%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <radialGradient id="alumniEnamel" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="70%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <filter id="alumniShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer Silver Heater Shield -->
  <path d="M 120 20 C 185 20 215 35 215 85 C 215 175 165 225 120 250 C 75 225 25 175 25 85 C 25 35 55 20 120 20 Z"
        fill="url(#pewterSilver)" filter="url(#alumniShadow)"/>

  <!-- Inner Dark Enamel Background -->
  <path d="M 120 30 C 175 30 200 44 200 85 C 200 165 155 210 120 234 C 85 210 40 165 40 85 C 40 44 65 30 120 30 Z"
        fill="url(#alumniEnamel)" stroke="url(#pewterSilver)" stroke-width="2"/>

  <!-- Classical Graduation Cap & Torch -->
  <g transform="translate(120, 115)">
    <!-- Torch handle and flame -->
    <path d="M -4 20 L -2 40 L 2 40 L 4 20 Z" fill="url(#pewterSilver)"/>
    <ellipse cx="0" cy="18" rx="8" ry="4" fill="url(#pewterSilver)"/>
    <path d="M -6 16 C -10 2 0 -12 0 -18 C 3 -8 10 0 6 16 Z" fill="#F59E0B" opacity="0.9"/>
    <path d="M -3 16 C -6 6 0 -2 0 -6 C 2 -1 6 5 3 16 Z" fill="#FEF08A"/>

    <!-- Mortarboard Diamond -->
    <polygon points="0,-28 35,-12 0,4 -35,-12" fill="url(#pewterSilver)" stroke="#1E293B" stroke-width="1.5"/>
    <polygon points="0,-24 30,-12 0,0 -30,-12" fill="#0F172A"/>
    <!-- Tassel -->
    <line x1="0" y1="-12" x2="28" y2="2" stroke="url(#pewterSilver)" stroke-width="1.5"/>
    <circle cx="28" cy="4" r="2.5" fill="url(#pewterSilver)"/>
  </g>

  <!-- Banner for ALUMNI -->
  <g transform="translate(120, 195)">
    <rect x="-55" y="-11" width="110" height="22" rx="4" fill="#0F172A" stroke="url(#pewterSilver)" stroke-width="1.8"/>
    <text x="0" y="4"
          font-family="Cinzel, Georgia, serif"
          font-size="10"
          font-weight="900"
          letter-spacing="2"
          fill="url(#pewterSilver)"
          text-anchor="middle">
      ALUMNI
    </text>
  </g>
</svg>
