<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <!-- Rich Gold Gradients -->
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0" />
      <stop offset="30%" stop-color="#E5B842" />
      <stop offset="60%" stop-color="#A67C1E" />
      <stop offset="85%" stop-color="#DFBA56" />
      <stop offset="100%" stop-color="#73510A" />
    </linearGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#E5B842" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Emerald Shield Enamel -->
    <radialGradient id="shieldEnamel" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#144A32" />
      <stop offset="60%" stop-color="#0B2B1D" />
      <stop offset="100%" stop-color="#05140D" />
    </radialGradient>
    <!-- Drop Shadow -->
    <filter id="chiseledShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Heraldic Shield with Gold Filigree Bevel -->
  <path d="M 200 20 C 310 20 370 45 370 120 C 370 280 280 390 200 450 C 120 390 30 280 30 120 C 30 45 90 20 200 20 Z"
        fill="url(#goldBevel)"
        filter="url(#chiseledShadow)" />

  <!-- Shield Step 2: Inner Deep Gold Border -->
  <path d="M 200 32 C 298 32 352 54 352 122 C 352 268 270 372 200 430 C 130 372 48 268 48 122 C 48 54 102 32 200 32 Z"
        fill="#1C1408" />

  <!-- Shield Step 3: Emerald Velvet Inlay -->
  <path d="M 200 42 C 288 42 338 62 338 125 C 338 258 260 356 200 412 C 140 356 62 258 62 125 C 62 62 112 42 200 42 Z"
        fill="url(#shieldEnamel)" />
  <path d="M 200 42 C 288 42 338 62 338 125 C 338 258 260 356 200 412 C 140 356 62 258 62 125 C 62 62 112 42 200 42 Z"
        fill="url(#goldSheen)" />

  <!-- Subtle Shield Grid / Quarters -->
  <line x1="200" y1="50" x2="200" y2="395" stroke="#E5B842" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="4 3" />
  <line x1="75" y1="210" x2="325" y2="210" stroke="#E5B842" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="4 3" />

  <!-- Laurel Wreath Around Center (Classical Honors) -->
  <g fill="url(#goldBevel)" opacity="0.9">
    <!-- Left Laurel Branch -->
    <path d="M 195 330 C 140 320 110 265 110 200 C 110 160 130 120 145 105 C 143 115 142 128 145 138 C 132 150 125 175 127 205 C 130 240 155 285 195 305 Z"/>
    <ellipse cx="120" cy="180" rx="14" ry="7" transform="rotate(-30 120 180)"/>
    <ellipse cx="126" cy="145" rx="13" ry="6" transform="rotate(-45 126 145)"/>
    <ellipse cx="138" cy="115" rx="12" ry="6" transform="rotate(-60 138 115)"/>
    <ellipse cx="125" cy="220" rx="14" ry="7" transform="rotate(-10 125 220)"/>
    <ellipse cx="140" cy="260" rx="15" ry="7" transform="rotate(15 140 260)"/>
    <ellipse cx="165" cy="295" rx="15" ry="7" transform="rotate(35 165 295)"/>

    <!-- Right Laurel Branch -->
    <path d="M 205 330 C 260 320 290 265 290 200 C 290 160 270 120 255 105 C 257 115 258 128 255 138 C 268 150 275 175 273 205 C 270 240 245 285 205 305 Z"/>
    <ellipse cx="280" cy="180" rx="14" ry="7" transform="rotate(30 280 180)"/>
    <ellipse cx="274" cy="145" rx="13" ry="6" transform="rotate(45 274 145)"/>
    <ellipse cx="262" cy="115" rx="12" ry="6" transform="rotate(60 262 115)"/>
    <ellipse cx="275" cy="220" rx="14" ry="7" transform="rotate(10 275 220)"/>
    <ellipse cx="260" cy="260" rx="15" ry="7" transform="rotate(-15 260 260)"/>
    <ellipse cx="235" cy="295" rx="15" ry="7" transform="rotate(-35 235 295)"/>
  </g>

  <!-- Central Emblem: Classical 1930s Leather Match Ball & Stars -->
  <g transform="translate(200, 195)">
    <!-- Ball Drop Shadow -->
    <circle cx="0" cy="8" r="46" fill="#000000" fill-opacity="0.6"/>
    <!-- Antique Gold Ring -->
    <circle cx="0" cy="0" r="45" fill="#1C1408" stroke="url(#goldBevel)" stroke-width="4"/>
    <!-- Classical 12-panel leather football seams -->
    <circle cx="0" cy="0" r="41" fill="#2E1B0E" />
    <path d="M -30 -15 C -10 -25 10 -25 30 -15 C 38 5 35 25 22 36 C 0 45 -20 40 -32 25 C -40 5 -38 -5 -30 -15 Z"
          fill="#3B2313" stroke="url(#goldBevel)" stroke-width="1.5" />
    <path d="M 0 -41 L 0 41 M -41 0 L 41 0" stroke="url(#goldBevel)" stroke-width="1.5" stroke-opacity="0.7"/>
    <circle cx="0" cy="0" r="14" fill="#1C1408" stroke="url(#goldBevel)" stroke-width="1.8"/>
    <!-- Gold Star In Center -->
    <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="url(#goldBevel)"/>
  </g>

  <!-- Three Top Stars (Tradition, Valor, Strategy) -->
  <g fill="url(#goldBevel)">
    <polygon points="200,60 203,67 210,67 204,71 206,78 200,74 194,78 196,71 190,67 197,67"/>
    <polygon points="165,70 167,76 173,76 168,80 170,86 165,82 160,86 162,80 157,76 163,76" transform="scale(0.85) translate(35, 10)"/>
    <polygon points="235,70 237,76 243,76 238,80 240,86 235,82 230,86 232,80 227,76 233,76" transform="scale(0.85) translate(35, 10)"/>
  </g>

  <!-- Classical Arched Banner for Academy Name -->
  <g transform="translate(0, 310)">
    <!-- Banner Ribbon Background -->
    <path d="M 50 35 L 75 10 L 105 25 L 295 25 L 325 10 L 350 35 L 330 65 L 305 48 L 95 48 L 70 65 Z"
          fill="url(#goldBevel)" filter="url(#chiseledShadow)"/>
    <path d="M 85 28 L 315 28 L 295 45 L 105 45 Z" fill="#161208"/>
    <!-- Typography -->
    <text x="200" y="40"
          font-family="Cinzel, Georgia, serif"
          font-size="14"
          font-weight="900"
          letter-spacing="4"
          fill="url(#goldBevel)"
          text-anchor="middle">
      NKCS FOOTBALL
    </text>
  </g>

  <!-- Bottom Classical Motto Ribbon -->
  <text x="200" y="380"
        font-family="Cinzel, Georgia, serif"
        font-size="10"
        font-weight="700"
        letter-spacing="2.5"
        fill="#E5B842"
        opacity="0.85"
        text-anchor="middle">
    EXCELLENTIA ET VIRTUS • 2018
  </text>
</svg>
