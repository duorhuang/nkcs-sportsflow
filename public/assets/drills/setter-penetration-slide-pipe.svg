<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vbDrillFloor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9A3412" />
      <stop offset="50%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>
    <marker id="vb-pass-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FACC15" />
    </marker>
    <marker id="vb-run-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="vb-spike-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F43F5E" />
    </marker>
  </defs>

  <!-- Volleyball Court Surface (Terra Cotta Hardwood) -->
  <rect width="800" height="500" fill="url(#vbDrillFloor)" rx="16"/>

  <!-- Boundary Lines (9m x 18m normalized) -->
  <rect x="100" y="50" width="600" height="400" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.9"/>

  <!-- Center Net Line (Heavy white bar with net mesh pattern) -->
  <line x1="400" y1="40" x2="400" y2="460" stroke="#FFFFFF" stroke-width="5"/>
  <rect x="395" y="45" width="10" height="410" fill="#1E293B" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- 3-Meter Attack Lines (Both Courts) -->
  <line x1="300" y1="50" x2="300" y2="450" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.85"/>
  <text x="290" y="70" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="end" opacity="0.8">3M ATTACK LINE</text>
  <line x1="500" y1="50" x2="500" y2="450" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Setter Penetration Route from Zone 1 to Zone 2.5 at Net -->
  <path d="M 160 380 Q 260 340 375 220" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#vb-run-arrow)"/>
  <text x="230" y="320" fill="#38BDF8" font-size="11" font-weight="bold">① 二传一号位高速插上网前</text>

  <!-- Setter Jump Set to Back Row -->
  <path d="M 375 210 Q 340 230 280 250" fill="none" stroke="#FACC15" stroke-width="3.5" marker-end="url(#vb-pass-arrow)"/>
  <text x="360" y="270" fill="#FEF08A" font-size="11" font-weight="bold">② 二传平快背送3米线</text>

  <!-- Middle Blocker Slide Decoy Run -->
  <path d="M 320 220 Q 350 140 375 110" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-dasharray="4 2" marker-end="url(#vb-run-arrow)"/>
  <text x="350" y="100" fill="#FDE68A" font-size="10" font-weight="bold">副攻背飞佯攻带走双人拦网</text>

  <!-- Pipe Spike Trajectory from Zone 6 into Opponent Seam -->
  <path d="M 270 250 L 620 250" fill="none" stroke="#F43F5E" stroke-width="4" marker-end="url(#vb-spike-arrow)"/>
  <text x="470" y="240" fill="#FDA4AF" font-size="12" font-weight="black">③ 105km/h 后排立体暴扣</text>

  <!-- Opponent Blockers (Shifting towards Net) -->
  <g transform="translate(425, 110)">
    <circle cx="0" cy="0" r="14" fill="#991B1B" stroke="#F87171" stroke-width="2"/>
    <text x="0" y="4" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">拦网1</text>
  </g>
  <g transform="translate(425, 160)">
    <circle cx="0" cy="0" r="14" fill="#991B1B" stroke="#F87171" stroke-width="2"/>
    <text x="0" y="4" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">拦网2</text>
  </g>

  <!-- Our Players -->
  <!-- Setter -->
  <g transform="translate(160, 380)">
    <circle cx="0" cy="0" r="18" fill="#1E3A8A" stroke="#60A5FA" stroke-width="2.5"/>
    <text x="0" y="5" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">7</text>
    <text x="0" y="32" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">田宇 (C)</text>
  </g>
  <!-- Outside Hitter Pipe Runner -->
  <g transform="translate(250, 250)">
    <circle cx="0" cy="0" r="18" fill="#1E3A8A" stroke="#60A5FA" stroke-width="2.5"/>
    <text x="0" y="5" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">10</text>
    <text x="0" y="32" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">张伟</text>
  </g>
  <!-- Middle Blocker -->
  <g transform="translate(320, 220)">
    <circle cx="0" cy="0" r="18" fill="#78350F" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="0" y="5" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">1</text>
    <text x="0" y="32" fill="#FDE68A" font-size="10" font-weight="bold" text-anchor="middle">韩阳 [名宿]</text>
  </g>

  <!-- Banner -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="180" height="48" rx="8" fill="#000000" fill-opacity="0.6" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2"/>
    <text x="12" y="20" fill="#38BDF8" font-size="11" font-weight="bold">二传插上与立体后攻 Pipe</text>
    <text x="12" y="38" fill="#D1D5DB" font-size="10">背飞佯攻拉开 • 撕裂双人拦网</text>
  </g>
</svg>
