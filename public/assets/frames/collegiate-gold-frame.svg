<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="frameGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="20%" stop-color="#E5B842" />
      <stop offset="50%" stop-color="#9A6F12" />
      <stop offset="80%" stop-color="#E5B842" />
      <stop offset="100%" stop-color="#5E4204" />
    </linearGradient>
    <linearGradient id="innerBevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7" />
    </linearGradient>
    <filter id="frameDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Layer with Chiseled Corners -->
  <path d="M 24 6 L 376 6 L 394 24 L 394 496 L 376 514 L 24 514 L 6 496 L 6 24 Z"
        fill="url(#frameGoldGrad)" filter="url(#frameDrop)"/>

  <!-- Middle Inset Mahogany / Dark Walnut Molding -->
  <path d="M 28 12 L 372 12 L 388 28 L 388 492 L 372 508 L 28 508 L 12 492 L 12 28 Z"
        fill="#120D06" stroke="url(#frameGoldGrad)" stroke-width="1.5"/>

  <!-- Inner Gold Bevel Rim -->
  <rect x="20" y="20" width="360" height="480" rx="8"
        fill="none" stroke="url(#frameGoldGrad)" stroke-width="3"/>

  <!-- Subtle Double Filigree Inset Line -->
  <rect x="26" y="26" width="348" height="468" rx="6"
        fill="none" stroke="#E5B842" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="8 4"/>

  <!-- Ornate Corner Medallions / Rosettes -->
  <!-- Top Left -->
  <g transform="translate(20, 20)">
    <circle cx="0" cy="0" r="10" fill="#1C1408" stroke="url(#frameGoldGrad)" stroke-width="2"/>
    <polygon points="0,-6 2,-2 6,-2 3,1 4,5 0,2 -4,5 -3,1 -6,-2 -2,-2" fill="url(#frameGoldGrad)"/>
  </g>
  <!-- Top Right -->
  <g transform="translate(380, 20)">
    <circle cx="0" cy="0" r="10" fill="#1C1408" stroke="url(#frameGoldGrad)" stroke-width="2"/>
    <polygon points="0,-6 2,-2 6,-2 3,1 4,5 0,2 -4,5 -3,1 -6,-2 -2,-2" fill="url(#frameGoldGrad)"/>
  </g>
  <!-- Bottom Left -->
  <g transform="translate(20, 500)">
    <circle cx="0" cy="0" r="10" fill="#1C1408" stroke="url(#frameGoldGrad)" stroke-width="2"/>
    <polygon points="0,-6 2,-2 6,-2 3,1 4,5 0,2 -4,5 -3,1 -6,-2 -2,-2" fill="url(#frameGoldGrad)"/>
  </g>
  <!-- Bottom Right -->
  <g transform="translate(380, 500)">
    <circle cx="0" cy="0" r="10" fill="#1C1408" stroke="url(#frameGoldGrad)" stroke-width="2"/>
    <polygon points="0,-6 2,-2 6,-2 3,1 4,5 0,2 -4,5 -3,1 -6,-2 -2,-2" fill="url(#frameGoldGrad)"/>
  </g>

  <!-- Inner Shadow Bevel on Canvas Cutout -->
  <rect x="32" y="32" width="336" height="456" rx="4"
        fill="url(#innerBevelGrad)" pointer-events="none"/>
</svg>
